name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  # 1. Run Home Assistant's official component validation engine
  validate:
    runs-on: ubuntu-latest
    name: Hassfest Validation
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  # 2. Automatically package and publish a GitHub Release when a version tag is pushed
  release:
    needs: validate
    runs-on: ubuntu-latest
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # Grants the token permissions to publish releases
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          description: |
            Automated production release of version ${{ github.ref_name }}.
            This release is optimized and structured for Home Assistant (HACS) installation.
          draft: false
          prerelease: false
